<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="五上數學">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#2E6B3F">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>html,body{margin:0}body{padding-bottom:env(safe-area-inset-bottom,0px)}</style>
<title>五上數學小步走</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* Layout: a squared exercise-book page. On a landscape iPad the problem sits on the left, the steps on the right.
   Palette: forest green — pine accent on a pale leaf-tinted page; units in woodland greens and earth tones. */
:root{
  --paper:#F2F6F1; --grid:#DFE9DE; --card:#FFFFFF; --ink:#1C2B21; --mute:#55695B; --line:#C8D7C9;
  --accent:#2E6B3F; --accent-soft:#E2EFE4; --on-accent:#FFFFFF;
  --hl:#F6D35B; --hl2:#A9D5A0; --hl3:#E8B48E;
  --ok:#1F7A4A; --ok-bg:#E1F2E7; --warn:#A84E00; --warn-bg:#FFEFD9;
  --u1:#2E6B3F; --u2:#8A5A2B; --u3:#4F6F2A; --u4:#23706B; --u5:#85600F; --u6:#3D6A86; --u7:#7A4E6B; --u8:#5B7F47; --u9:#A0522D; --u10:#41604F;
  --display:"LXGW WenKai TC","Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible","Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --num:"Atkinson Hyperlegible","Noto Sans TC","PingFang TC",system-ui,sans-serif;
  --rad:16px; --head:3.4rem;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#111A14; --grid:#18241B; --card:#17231B; --ink:#E4EEE6; --mute:#9CB3A2; --line:#30453A;
  --accent:#74C38A; --accent-soft:#183222; --on-accent:#0C1A10;
  --hl:#C9A23A; --hl2:#3F7A48; --hl3:#9A6446;
  --ok:#6CCB93; --ok-bg:#16301F; --warn:#F2A35A; --warn-bg:#3A2913; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --paper:#111A14; --grid:#18241B; --card:#17231B; --ink:#E4EEE6; --mute:#9CB3A2; --line:#30453A;
  --accent:#74C38A; --accent-soft:#183222; --on-accent:#0C1A10;
  --hl:#C9A23A; --hl2:#3F7A48; --hl3:#9A6446;
  --ok:#6CCB93; --ok-bg:#16301F; --warn:#F2A35A; --warn-bg:#3A2913; color-scheme:dark;
}
html{font-size:20px;-webkit-text-size-adjust:100%}
html[data-big]{font-size:24px}
body{background-color:var(--paper);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:28px 28px;color:var(--ink);font-family:var(--body);line-height:1.6;font-size:1rem;-webkit-tap-highlight-color:transparent}
html[data-calm] body{background-image:none}
html[data-calm] main, html[data-calm] .top{filter:saturate(.4)}
html[data-calm] *, html[data-calm] *::before, html[data-calm] *::after{animation:none!important;transition:none!important}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
*{box-sizing:border-box}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px;border-radius:8px}
mark{background:var(--hl);color:var(--ink);padding:0 .15em;border-radius:4px}
b{font-weight:700}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--card);border-bottom:1px solid var(--line)}
.top-in{max-width:1200px;margin:0 auto;padding:.4rem 16px;display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;min-height:var(--head)}
.brand{display:flex;align-items:center;gap:.5rem;color:var(--ink);font-family:var(--display);font-weight:700;font-size:1.15rem;background:none;border:0;padding:.2rem .3rem}
.brand-mark{width:1.7rem;height:1.7rem;border-radius:7px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-family:var(--num);font-size:.9rem}
.top-sp{flex:1}
.chip{display:inline-flex;align-items:center;gap:.35rem;border:2px solid var(--line);background:var(--card);border-radius:999px;padding:.25rem .9rem;font-size:.85rem;min-height:2.4rem}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--ink);font-weight:700}
.chip svg{width:1.1em;height:1.1em}
.settings{max-width:1200px;margin:0 auto;padding:0 16px .6rem;display:flex;gap:.5rem;flex-wrap:wrap}

main{max-width:1200px;margin:0 auto;padding-inline:16px;padding-block:1rem 4rem}
h1,h2,h3{font-family:var(--display);text-wrap:balance;line-height:1.3;margin:0}
h1{font-size:2rem}
h2{font-size:1.45rem}
.lead{color:var(--mute);margin:.2rem 0 0}
.crumbs{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center;margin-bottom:.5rem}
.link{background:none;border:0;color:var(--accent);font-weight:700;padding:.35rem .2rem;display:inline-flex;align-items:center;gap:.3rem;min-height:2.4rem}
.link svg{width:1em;height:1em}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:.45rem;min-height:3rem;padding:.5rem 1.3rem;border-radius:14px;border:2px solid var(--accent);background:var(--accent);color:var(--on-accent);font-weight:700;font-size:1.05rem}
.btn.ghost{background:var(--card);color:var(--accent)}
.btn.small{min-height:2.6rem;font-size:.95rem;padding:.3rem 1rem}
.btn svg{width:1.1em;height:1.1em}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.45}
.row{display:flex;gap:.7rem;flex-wrap:wrap;align-items:center}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--rad);padding:1.1rem 1.2rem}
.say{flex:none;width:2.7rem;height:2.7rem;border-radius:50%;border:2px solid var(--line);background:var(--card);display:grid;place-items:center;color:var(--accent)}
.say svg{width:1.3rem;height:1.3rem}
.prompt{display:flex;gap:.7rem;align-items:flex-start}
.prompt .txt{flex:1;min-width:0;font-size:1.15rem}
.split{display:grid;gap:1rem}
.split>*{min-width:0}

/* Home */
.hero{display:grid;grid-template-columns:1fr auto;gap:1.2rem;align-items:center;margin-bottom:1rem}
.ring{width:6.5rem;height:6.5rem;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .pct{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--num);font-weight:700;font-size:1.25rem;text-align:center;line-height:1.1}
.ring .pct small{display:block;font-size:.6rem;color:var(--mute);font-family:var(--body);font-weight:400}
.howto{display:grid;grid-template-columns:repeat(4,1fr);gap:.6rem;margin:.6rem 0 1.2rem}
.howto div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:.55rem .8rem}
.howto b{font-family:var(--display);font-size:1.15rem;display:block}
.howto span{color:var(--mute);font-size:.85rem}
.units{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:1rem}
.unit{background:var(--card);border:1px solid var(--line);border-radius:var(--rad);overflow:hidden;display:flex;flex-direction:column}
.unit-head{background:var(--u);color:#fff;padding:.65rem 1rem;display:flex;align-items:center;gap:.8rem}
.unit-no{font-family:var(--num);font-weight:700;font-size:2rem;line-height:1}
.unit-name{font-family:var(--display);font-weight:700;font-size:1.12rem;line-height:1.3}
.unit-body{padding:.7rem 1rem 1rem;display:flex;flex-direction:column;gap:.5rem;flex:1}
.glyph{font-family:var(--num);font-weight:700;font-size:1.2rem;color:var(--u);display:flex;align-items:center;gap:.2rem;min-height:2.5rem}
.topics{color:var(--mute);font-size:.82rem}
.bar{height:.55rem;background:var(--grid);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--u);border-radius:99px}
.meta{font-size:.78rem;color:var(--mute);display:flex;justify-content:space-between;gap:.5rem;flex-wrap:wrap}
.unit .row{margin-top:auto}
.unit .btn{flex:1;min-height:2.8rem;font-size:.95rem;padding:.4rem .6rem;background:var(--u);border-color:var(--u);color:#fff}
.unit .btn.ghost{background:var(--card);color:var(--u)}
.note{color:var(--mute);font-size:.85rem;margin-top:1.2rem}

/* Unit map */
.uhead{display:flex;gap:1rem;align-items:center;margin-bottom:1rem}
.badge{background:var(--u);color:#fff;border-radius:14px;font-family:var(--num);font-weight:700;font-size:1.8rem;width:3.4rem;height:3.4rem;display:grid;place-items:center;flex:none}
.levels{display:grid;gap:.8rem}
.lvl{display:grid;grid-template-columns:auto 1fr auto;gap:1rem;align-items:center;background:var(--card);border:2px solid var(--line);border-radius:var(--rad);padding:.85rem 1rem;text-align:left;width:100%}
.lvl.next{border-color:var(--u);box-shadow:0 0 0 4px color-mix(in srgb,var(--u) 18%,transparent)}
.lvl-no{width:2.8rem;height:2.8rem;border-radius:50%;border:3px solid var(--u);color:var(--u);display:grid;place-items:center;font-family:var(--num);font-weight:700;font-size:1.2rem}
.lvl.done .lvl-no{background:var(--u);color:#fff}
.lvl-t{font-family:var(--display);font-weight:700;font-size:1.2rem}
.lvl-s{color:var(--mute);font-size:.85rem}
.pips{display:flex;gap:.25rem}
.pips i{width:.8rem;height:.8rem;border-radius:50%;border:2px solid var(--u)}
.pips i.on{background:var(--u)}
.tag{font-size:.75rem;font-weight:700;color:var(--u);display:block}

/* Level */
.lv-top{display:grid;gap:.6rem;margin-bottom:.9rem}
.stages{display:grid;grid-template-columns:repeat(4,1fr);gap:.4rem}
.stage{border:2px solid var(--line);background:var(--card);border-radius:12px;padding:.4rem .3rem;font-family:var(--display);font-weight:700;font-size:1.05rem;display:flex;align-items:center;justify-content:center;gap:.3rem;min-height:3rem}
.stage small{font-family:var(--body);font-weight:400;font-size:.7rem;color:var(--mute);display:block}
.stage[aria-current="step"]{border-color:var(--u);background:var(--u);color:#fff}
.stage[aria-current="step"] small{color:#fff}
.stage .ck{width:1.1rem;height:1.1rem;color:var(--ok)}
.stage[aria-current="step"] .ck{color:#fff}
.vis-box{display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:1rem;margin:.9rem 0 .2rem;overflow-x:auto}
.vis{width:100%;height:auto;display:block}
.vis .t{fill:var(--ink);font-family:var(--num);font-weight:700;font-size:17px}
.vis .tm{fill:var(--mute);font-family:var(--body);font-size:14px}
.vis .fa{fill:var(--hl)} .vis .fb{fill:var(--hl2)} .vis .fc{fill:var(--hl3)} .vis .fp{fill:var(--card)} .vis .fi{fill:var(--ink)}
.vis .st{stroke:var(--ink);stroke-width:2} .vis .st1{stroke:var(--ink);stroke-width:1.5} .vis .st3{stroke:var(--ink);stroke-width:3;fill:none}
.vis .gl{stroke:var(--line);stroke-width:1} .vis .ln2{fill:none;stroke:var(--accent);stroke-width:3.5;stroke-linecap:round}
.vis .stick{stroke:var(--warn);stroke-width:5;stroke-linecap:round}
.vis .dash{fill:none;stroke:var(--mute);stroke-width:1.5;stroke-dasharray:5 5}
.steps{display:grid;gap:.8rem}
.step{border:2px dashed var(--line);border-radius:14px;padding:.8rem 1rem;background:var(--card)}
.step.done{border-style:solid;border-color:var(--ok);background:var(--ok-bg)}
.step-n{font-size:.8rem;font-weight:700;color:var(--u)}
.ans{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center;margin-top:.7rem;font-size:1.25rem;font-family:var(--num)}
.ans .part{display:inline-flex;align-items:center;gap:.4rem;flex-wrap:wrap}
.box{width:5.2em;min-height:2.7rem;font:inherit;font-weight:700;font-size:1.25rem;text-align:center;border:3px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);padding:.15rem .3rem;caret-color:var(--accent)}
.box:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 4px var(--accent-soft)}
.box.ok{border-color:var(--ok);background:var(--ok-bg)}
.box.bad{border-color:var(--warn);background:var(--warn-bg)}
.fr .box{width:3.4em;min-height:2.3rem;font-size:1.1rem}
.choices{gap:.6rem}.opt-wrap{display:inline-flex;align-items:stretch}.opt-wrap .opt{border-top-right-radius:0;border-bottom-right-radius:0;border-right-width:1px}.opt-say{width:2.6rem;flex:none;display:grid;place-items:center;border:3px solid var(--line);border-left-width:1px;border-radius:0 12px 12px 0;background:var(--accent-soft);color:var(--accent);padding:0;cursor:pointer}.opt-say svg{width:1.25rem;height:1.25rem}.fb-msg .fb-say{margin-left:auto;flex:none;width:2.2rem;height:2.2rem;align-self:center}.fb-msg .fb-say svg{width:1.1rem;height:1.1rem;margin:0}
.opt{min-height:3.1rem;min-width:4.6rem;padding:.4rem 1.1rem;border:3px solid var(--line);background:var(--card);border-radius:12px;font-size:1.15rem;font-weight:700;font-family:var(--body);display:inline-flex;align-items:center;justify-content:center;gap:.2rem}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.ok{border-color:var(--ok);background:var(--ok-bg)}
.opt.bad{border-color:var(--warn);background:var(--warn-bg)}
.opt svg{width:150px;height:auto}
.fb-msg{margin-top:.6rem;padding:.55rem .9rem;border-radius:10px;font-weight:700;display:flex;gap:.5rem;align-items:flex-start}
.fb-msg.ok{background:var(--ok-bg);color:var(--ok)}
.fb-msg.bad{background:var(--warn-bg);color:var(--warn)}
.fb-msg.info{background:var(--accent-soft);color:var(--ink);font-weight:400}
.fb-msg svg{width:1.3rem;height:1.3rem;flex:none;margin-top:.15rem}
.stars{display:flex;gap:.3rem;justify-content:center;margin:.2rem 0 .6rem}
.stars svg{width:2rem;height:2rem;color:var(--line)}
.stars svg.on{color:var(--hl)}
.stamp{text-align:center;padding:1.4rem 1rem}
.stamp .big{width:5.5rem;height:5.5rem;border-radius:50%;margin:0 auto .6rem;border:5px solid var(--ok);color:var(--ok);display:grid;place-items:center;animation:pop .45s ease-out}
.stamp .big svg{width:3rem;height:3rem}
@keyframes pop{from{transform:scale(.5) rotate(-12deg);opacity:.4}to{transform:none;opacity:1}}
.worked{margin-top:.8rem;border-top:2px dashed var(--line);padding-top:.6rem;display:grid;gap:.35rem;font-size:.95rem}
.worked div{display:flex;gap:.5rem;flex-wrap:wrap}
.worked .a{font-weight:700;color:var(--ok)}
.navrow{display:flex;justify-content:space-between;gap:.6rem;flex-wrap:wrap;margin-top:1rem}

/* 我看: worked example with a visible roadmap of steps */
.ex-tag{display:inline-block;background:var(--u);color:#fff;font-weight:700;font-size:.8rem;border-radius:6px;padding:.05rem .55rem;margin-bottom:.4rem}
.clue-head{display:flex;justify-content:space-between;align-items:center;gap:.5rem;margin-bottom:.6rem}
.clue-head b{font-family:var(--display);font-size:1.15rem}
.clue-head span{color:var(--mute);font-size:.85rem}
.clues{list-style:none;margin:0;padding:0;display:grid;gap:.5rem}
.clue{border:2px solid var(--line);border-radius:12px;background:var(--card)}
.clue-k{display:flex;gap:.6rem;align-items:center;width:100%;background:none;border:0;padding:.5rem .7rem;text-align:left;font-weight:700;min-height:2.8rem}
.clue .n{width:1.9rem;height:1.9rem;flex:none;border-radius:50%;display:grid;place-items:center;font-family:var(--num);font-size:.95rem;border:2px solid var(--u);color:var(--u)}
.clue-t{padding:0 .8rem .7rem 3.2rem;font-size:1.12rem}
.clue.todo{border-style:dashed;color:var(--mute)}
.clue.todo .n{border-color:var(--line);color:var(--mute)}
.clue.done .n{background:var(--u);color:#fff}
.clue.cur{border-color:var(--u);box-shadow:0 0 0 4px color-mix(in srgb,var(--u) 16%,transparent)}
.clue.cur .n{background:var(--u);color:#fff}
.peek{display:inline-flex;vertical-align:middle}
.peek-b{min-width:2.8rem;min-height:2.3rem;border:3px dashed var(--accent);border-radius:10px;background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:1.1rem;padding:0 .5rem;animation:breathe 1.8s ease-in-out infinite}
@keyframes breathe{50%{box-shadow:0 0 0 5px color-mix(in srgb,var(--accent) 22%,transparent)}}
.peek-v{background:var(--hl);color:var(--ink);border-radius:6px;padding:0 .3rem;font-weight:700}
.keypt{margin-top:1rem;border:3px solid var(--u);border-radius:14px;padding:.8rem 1rem;background:var(--card)}
.keypt b.lab{display:block;font-family:var(--display);color:var(--u);font-size:1.05rem}
.key-txt{font-family:var(--display);font-size:1.35rem;line-height:1.7;margin:.4rem 0 .8rem}
.read-row{display:flex;gap:.6rem;flex-wrap:wrap}
.read-btn{--p:0%;background:linear-gradient(90deg,var(--accent) var(--p),color-mix(in srgb,var(--accent) 35%,var(--card)) var(--p));transition:background .9s linear}
.read-btn:disabled{opacity:1;color:var(--on-accent)}
.stage.locked{color:var(--mute);border-style:dashed}
.stage .ck.lk{color:var(--mute)}
.look-hint{color:var(--mute);font-size:.85rem;margin-top:.6rem}

/* Math bits */
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.15;margin:0 .12em;font-family:var(--num);font-weight:700}
.fr>span:first-child{border-bottom:2.5px solid currentColor;padding:0 .2em}
.fr>.box:first-child{border-bottom:3px solid var(--line);margin-bottom:3px}
.mixed{display:inline-flex;align-items:center;font-family:var(--num);font-weight:700}
.ladder{border-collapse:collapse;font-family:var(--num);font-weight:700;font-size:1.35rem;margin:auto}
.ladder td{padding:.15rem .7rem;text-align:center;min-width:2.6rem}
.ladder tr:not(.last) td.ln{border-bottom:3px solid var(--ink)}
.ladder tr:not(.last) td.ln.first{border-left:3px solid var(--ink)}
.ladder .hl{background:var(--hl);border-radius:6px}
.ladder .lp{color:var(--accent)}
.ngrid{display:grid;grid-template-columns:repeat(10,2.3rem);gap:.3rem;font-family:var(--num);font-weight:700}
.ngrid span{height:2.3rem;display:grid;place-items:center;border:2px solid var(--line);border-radius:8px;background:var(--card)}
.ngrid span.on{background:var(--hl);border-color:var(--ink)}
.chips{display:flex;gap:.4rem;flex-wrap:wrap;align-items:center;font-family:var(--num);font-weight:700;font-size:1.15rem}
.chips em{font-style:normal;font-family:var(--body);font-size:.85rem;color:var(--mute);min-width:4.5rem}
.chips span{border:2px solid var(--line);border-radius:8px;padding:.05rem .55rem;background:var(--card)}
.chips span.on{background:var(--hl);border-color:var(--ink)}
.tbl-wrap{overflow-x:auto;max-width:100%}
table.tb{border-collapse:collapse;font-family:var(--num);font-weight:700;font-size:1.1rem;margin:auto}
table.tb td,table.tb th{border:2px solid var(--line);padding:.3rem .7rem;text-align:center;background:var(--card)}
table.tb th{background:var(--accent-soft);font-family:var(--body)}
table.tb td.q{background:var(--hl);color:var(--ink)}
.formula{font-family:var(--display);font-size:1.35rem;text-align:center;padding:.6rem 1rem;border:3px solid var(--u);border-radius:14px;background:var(--card)}
.big-eq{font-family:var(--num);font-weight:700;font-size:1.6rem;text-align:center;display:flex;align-items:center;justify-content:center;gap:.4rem;flex-wrap:wrap}
.big-eq .arrow{color:var(--accent)}

/* Quiz */
.qitem{display:grid;grid-template-columns:auto 1fr;gap:.8rem;background:var(--card);border:2px solid var(--line);border-radius:var(--rad);padding:1rem}
.qitem.right{border-color:var(--ok)}
.qitem.wrong{border-color:var(--warn)}
.qno{width:2.2rem;height:2.2rem;border-radius:50%;background:var(--u);color:#fff;display:grid;place-items:center;font-family:var(--num);font-weight:700}
.qbody{min-width:0;display:grid;gap:.4rem}
.qlist{display:grid;gap:.9rem}
.qhead{display:flex;gap:1rem;align-items:flex-end;flex-wrap:wrap;justify-content:space-between;margin-bottom:1rem}
.qopts{display:grid;gap:.5rem}
.seg{display:inline-flex;border:2px solid var(--u);border-radius:14px;overflow:hidden}
.seg button{border:0;background:var(--card);color:var(--u);font-weight:700;padding:.5rem 1.2rem;min-height:3rem;font-size:1.05rem}
.seg button[aria-pressed="true"]{background:var(--u);color:#fff}
.seg button small{display:block;font-weight:400;font-size:.7rem}
.ver{display:flex;gap:.4rem;align-items:center;flex-wrap:wrap;font-size:.9rem;color:var(--mute)}
.score{font-family:var(--num);font-size:2.2rem;font-weight:700;color:var(--u);display:flex;align-items:baseline;gap:1rem;flex-wrap:wrap}.score-pct{font-size:1.6rem;background:var(--u);color:#fff;border-radius:12px;padding:.05rem .8rem}
details.teacher{margin-top:1.6rem;background:var(--card);border:2px solid var(--line);border-radius:var(--rad);padding:.8rem 1rem}
details.teacher summary{font-weight:700;cursor:pointer;font-family:var(--display);font-size:1.15rem;min-height:2.4rem}
table.key{border-collapse:collapse;width:100%;font-size:.9rem;margin-top:.8rem}
table.key th,table.key td{border:1px solid var(--line);padding:.35rem .5rem;text-align:left;vertical-align:top}
table.key th{background:var(--accent-soft)}

/* Number pad: docked right under the question being answered */
.pad{margin-top:.7rem;max-width:330px;display:grid;grid-template-columns:repeat(4,1fr);gap:.4rem;padding:.5rem;border:2px solid var(--line);border-radius:14px;background:var(--paper)}
.pad button{min-height:3.1rem;border-radius:11px;border:2px solid var(--line);background:var(--card);font-family:var(--num);font-weight:700;font-size:1.35rem}
.pad button:active{background:var(--accent-soft)}
.pad .zero{grid-column:span 2}
.pad .go{grid-column:span 2;background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-family:var(--body);font-size:1.05rem}

/* grid drawing answer */
.gridans{display:block}
.grid-draw{display:flex;flex-wrap:wrap;gap:1rem;align-items:center}
.grid-draw .vis-box{margin:0;flex:1 1 240px}
.grid-ctl{display:grid;gap:.5rem;font-family:var(--body);font-size:1.1rem}
.grid-ctl div{display:flex;align-items:center;gap:.5rem}
.grid-ctl .opt{min-width:3.1rem;padding:0;font-size:1.5rem}
.grid-ctl b{font-family:var(--num);font-size:1.5rem;min-width:2rem;text-align:center}
.gridans.ok .vis{outline:3px solid var(--ok);border-radius:6px}
.gridans.bad .vis{outline:3px solid var(--warn);border-radius:6px}
.pulse{animation:breathe 1.6s ease-in-out infinite;border-color:var(--accent)}

/* calculator (teacher can switch it on in 設定) */
.calc-btn{margin-top:.6rem}
.calc{margin-top:.7rem;max-width:300px;display:grid;grid-template-columns:repeat(4,1fr);gap:.35rem;padding:.5rem;border:2px solid var(--line);border-radius:14px;background:var(--paper)}
.calc .scr{grid-column:1/-1;background:var(--card);border:2px solid var(--line);border-radius:10px;padding:.3rem .6rem;text-align:right;font-family:var(--num);font-weight:700;font-size:1.4rem;min-height:2.6rem;overflow-x:auto;white-space:nowrap}
.calc button{min-height:2.8rem;border-radius:10px;border:2px solid var(--line);background:var(--card);font-family:var(--num);font-weight:700;font-size:1.25rem}
.calc button.op{color:var(--accent)}
.calc button.eq{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}

table.tb td,table.tb th{white-space:nowrap;padding:.3rem .55rem}
/* learning mode */
.mode-row{display:flex;align-items:center;gap:.7rem;flex-wrap:wrap;margin:.7rem 0 1rem}
.mode-row>span{font-weight:700;color:var(--mute);font-size:.9rem}
.pill-mode{margin-left:auto;font-size:.8rem;font-weight:700;color:var(--u);border:2px solid var(--u);border-radius:999px;padding:.05rem .7rem}
.howto.howto2{grid-template-columns:repeat(2,1fr)}
.stages.two{grid-template-columns:repeat(2,1fr)}

/* 學習紀錄 */
.prog-sum{display:grid;grid-template-columns:repeat(4,1fr);gap:.8rem;margin:1rem 0 1.2rem}
.prog-sum .card{display:flex;flex-direction:column;gap:.1rem;padding:.8rem 1rem}
.prog-sum b{font-family:var(--num);font-size:1.7rem;color:var(--accent)}
.prog-sum span{color:var(--mute);font-size:.85rem}
.prog-list{display:grid;gap:1rem}
.prog-unit{display:grid;gap:.55rem}
.prog-head{display:flex;align-items:center;gap:.7rem}
.prog-head h2{font-size:1.2rem}
.small-badge{width:2.3rem;height:2.3rem;font-size:1.15rem;border-radius:10px}
.prog-row{display:grid;grid-template-columns:auto 1fr auto;gap:.7rem;align-items:center}
.prog-lab{font-weight:700;font-size:.85rem;color:var(--mute);margin-right:.4rem}
.prog-num{font-family:var(--num);font-size:.9rem}
.lv-chips{display:flex;flex-wrap:wrap;gap:.35rem}
.lv-chip{border:2px solid var(--line);background:var(--card);border-radius:999px;padding:.15rem .7rem;font-size:.8rem;min-height:2.1rem;color:var(--mute)}
.lv-chip.doing{border-color:var(--u);color:var(--ink)}
.lv-chip.done{background:var(--u);border-color:var(--u);color:#fff}
.prog-quiz{display:grid;gap:.35rem;border-top:2px dashed var(--line);padding-top:.6rem}
.prog-quiz .btn{justify-self:start}
.muted{color:var(--mute);font-size:.9rem}
.weak{color:var(--warn);font-weight:700;font-size:.9rem;display:flex;flex-wrap:wrap;gap:.2rem .6rem;align-items:center}
.weak .link{min-height:2rem;font-size:.9rem}
.ok-line{color:var(--ok);font-weight:700;font-size:.9rem}
@media (min-width:900px){.prog-list{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:640px){.prog-sum{grid-template-columns:1fr}.prog-row{grid-template-columns:1fr}}
/* 繼續學習 + folded groups */
.cont-row{display:flex;align-items:center;gap:.8rem;flex-wrap:wrap;margin:.4rem 0 1.2rem}
.cont-btn{border:0;background:var(--u);color:#fff;border-radius:16px;padding:.9rem 1.5rem;font-family:var(--display);font-weight:700;font-size:1.35rem;min-height:3.6rem;box-shadow:0 3px 0 color-mix(in srgb,var(--u) 55%,#000);text-align:left;max-width:100%}
.cont-btn:active{transform:translateY(2px);box-shadow:none}
.cont-lab{opacity:.92}
.cont-done{background:var(--ok-bg);color:var(--ok);font-weight:700;border-radius:14px;padding:.8rem 1.1rem}
details.grp{background:var(--card);border:1px solid var(--line);border-radius:18px;margin-bottom:1rem}
details.grp>summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:1rem 1.3rem;min-height:4rem}
details.grp>summary::-webkit-details-marker{display:none}
details.grp>summary::before{content:'▸';color:var(--accent);font-size:1.1rem;transition:transform .2s;margin-right:-.4rem}
details.grp[open]>summary::before{transform:rotate(90deg)}
.grp-t{font-family:var(--display);font-weight:700;font-size:1.55rem;flex:1}
.grp-n{color:var(--mute);font-size:.9rem;white-space:nowrap}
details.grp>.units{padding:0 1.1rem 1.1rem}
/* 星星集點 */
:root{--star:#D99A00}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--star:#F0C24F}}
:root[data-theme="dark"]{--star:#F0C24F}
.stars-txt{color:var(--star);letter-spacing:.06em;white-space:nowrap}
.stars-txt .off{color:var(--line)}
.lvl-stars{display:inline-block;margin-left:.5rem;font-size:1rem}
.earn{font-size:3rem;line-height:1.1;margin:.2rem 0 .3rem;animation:pop .45s ease-out}
.new-rec{color:var(--accent);font-weight:700;margin:.3rem 0}
.star-n{color:var(--star);font-family:var(--num)}
.got-badge{display:inline-flex;gap:.8rem;align-items:center;text-align:left;margin-top:.6rem;padding:.7rem 1rem;border:2px solid var(--star);border-radius:14px;background:var(--card)}
.got-badge svg{width:3rem;height:3rem;flex:none}
.star-sum{display:flex;align-items:center;gap:1.2rem;flex-wrap:wrap;margin:0 0 1.2rem;padding:.8rem 1.2rem}
.star-big{font-family:var(--num);font-weight:700;font-size:2rem;color:var(--star)}
.star-big small{font-size:.9rem;color:var(--mute)}
.star-next{display:flex;align-items:center;gap:.8rem;flex-wrap:wrap;flex:1;min-width:0}
.star-bar{flex:1;min-width:120px}.star-bar i{background:var(--star)}
.pill-badge{display:inline-flex;align-items:center;gap:.3rem;border:2px solid var(--star);border-radius:999px;padding:.1rem .7rem .1rem .3rem;font-weight:700;font-size:.85rem}
.pill-badge svg{width:1.6rem;height:1.6rem}
.badges{display:grid;grid-template-columns:repeat(6,1fr);gap:.6rem;margin:0 0 1.2rem}
.badge-item{display:flex;flex-direction:column;align-items:center;text-align:center;gap:.2rem;padding:.6rem .4rem;border:2px solid var(--line);border-radius:14px;background:var(--card);color:var(--mute)}
.badge-item.got{border-color:var(--star);color:var(--ink)}
.badge-item svg{width:2.8rem;height:2.8rem}
.badge-item b{font-size:.85rem}.badge-item small{font-size:.72rem;color:var(--mute)}
.md-c{fill:var(--star)}.md-r{fill:var(--accent)}.md-s{fill:#fff}.md-off{fill:var(--line)}.md-offs{fill:var(--card)}
@media (max-width:640px){.badges{grid-template-columns:repeat(3,1fr)}}
/* 練習遊戲 */
.drill-h{margin:1.6rem 0 .7rem}
.drill-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:1rem}a.drill-card{color:inherit;text-decoration:none}
.drill-card{display:flex;gap:1rem;align-items:center;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:1rem 1.2rem;min-height:5.4rem}
.drill-card:hover{border-color:var(--accent)}
.drill-card b{font-family:var(--display);font-size:1.3rem;display:block}
.drill-card small{color:var(--mute);font-size:.85rem;line-height:1.5}
.dc-ic{width:3.3rem;height:3.3rem;border-radius:14px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-family:var(--num);font-weight:700;font-size:2rem;flex:none}
.tt-tables{display:grid;grid-template-columns:repeat(8,1fr);gap:.5rem;margin:1rem 0 .7rem}
.tt-tab{border:2px solid var(--line);background:var(--card);border-radius:14px;padding:.35rem .2rem;display:flex;flex-direction:column;align-items:center;min-height:3.9rem}
.tt-tab b{font-family:var(--num);font-size:1.6rem;line-height:1.1}
.tt-tab small{font-size:.7rem;color:var(--mute)}
.tt-tab.on{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.tt-tab.master{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}.tt-tab.master small{color:var(--on-accent);font-weight:700}.tt-tab.master.on{box-shadow:0 0 0 4px var(--accent-soft),0 0 0 6px var(--accent)}
.tt-modes{display:flex;gap:.5rem;flex-wrap:wrap}
.tt-mode{border:2px solid var(--line);background:var(--card);border-radius:999px;padding:.4rem 1.1rem;font-weight:700;min-height:2.9rem}
.tt-mode.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.tt-card{text-align:center}
.tt-dots{display:flex;gap:.3rem;justify-content:center;flex-wrap:wrap;margin-bottom:.6rem}
.tt-dots i{width:.75rem;height:.75rem;border-radius:50%;background:var(--line)}
.tt-dots i.done{background:var(--ok)}.tt-dots i.cur{background:var(--accent)}
.tt-eq{font-family:var(--num);font-weight:700;font-size:3.3rem;display:flex;justify-content:center;align-items:center;gap:.5rem;margin:1.2rem 0;flex-wrap:wrap}
.tt-eq .op{color:var(--accent)}
.tt-blank{min-width:4.4rem;border:4px dashed var(--accent);border-radius:16px;padding:0 .4rem;color:var(--mute)}
.tt-blank.typed{color:var(--ink);border-style:solid}
.tt-blank.ok{border-color:var(--ok);background:var(--ok-bg);color:var(--ok)}
.tt-blank.bad{border-color:var(--warn);background:var(--warn-bg);color:var(--warn)}
.tt-sel{display:flex;flex-wrap:wrap;gap:.5rem;margin:.6rem 0 1rem}
.dpad{display:grid;grid-template-columns:repeat(3,1fr);gap:.6rem;max-width:390px;margin:auto}
.dkey{min-height:4.1rem;border-radius:16px;border:2px solid var(--line);background:var(--card);font-family:var(--num);font-weight:700;font-size:1.9rem}
.dkey:active{background:var(--accent-soft)}
.dkey.ok{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-family:var(--body);font-size:1.25rem}
.as-levels{display:flex;gap:.4rem;flex-wrap:wrap;margin:.8rem 0}
.as-lv{border:2px solid var(--line);background:var(--card);border-radius:999px;padding:.35rem .9rem;font-weight:700;font-size:.85rem;min-height:2.6rem;color:var(--mute)}
.as-lv.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.as-lv.tm.on{background:var(--hl);border-color:var(--hl);color:var(--ink)}
.as-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:.5rem;margin-bottom:.9rem}
.as-stats div{background:var(--card);border:1px solid var(--line);border-radius:12px;text-align:center;padding:.4rem}
.as-stats b{display:block;font-family:var(--num);font-size:1.45rem;color:var(--accent)}
.as-stats small{color:var(--mute);font-size:.72rem}
.as-timer{display:flex;align-items:center;gap:.6rem;margin-bottom:.9rem}
.as-track{flex:1;height:10px;border-radius:99px;background:var(--grid);overflow:hidden}
.as-fill{height:100%;background:var(--accent);border-radius:99px;transition:width .1s linear}
.as-fill.warn{background:var(--hl)}.as-fill.danger{background:var(--warn)}
.as-board{display:grid;justify-content:center;column-gap:.25rem;row-gap:.15rem;font-family:var(--num);font-weight:700;font-size:2.6rem;margin:0 auto;width:fit-content}
.as-board .c{text-align:center;line-height:1.2;display:flex;justify-content:center;align-items:flex-end}
.as-board .op{color:var(--accent)}
.as-board .rule{grid-column:1/-1;border-bottom:4px solid var(--ink);margin:.2rem 0 .5rem}
.as-note{height:1.8rem;width:1.8rem;border:2px dashed var(--line);border-radius:8px;font-size:1rem;font-weight:700;color:var(--accent);background:none;padding:0;font-family:var(--num)}
.as-ans{width:3.1rem;height:3.6rem;border:3px solid var(--line);border-radius:12px;display:grid;place-items:center;background:var(--card);cursor:pointer}
.as-ans.act{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.as-ans.ok{border-color:var(--ok);background:var(--ok-bg);color:var(--ok)}
.as-ans.bad{border-color:var(--warn);background:var(--warn-bg);color:var(--warn)}
.tt-mini{display:flex;gap:.4rem;flex-wrap:wrap;margin:.4rem 0}
.tt-mini span{border:2px solid var(--line);border-radius:10px;padding:.1rem .5rem;font-family:var(--num);font-weight:700;display:flex;flex-direction:column;align-items:center;min-width:3rem}
.tt-mini small{font-size:.65rem;color:var(--mute);font-weight:400}
.tt-mini .master{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}.tt-mini .master small{color:var(--on-accent)}
.tt-mini .doing{border-color:var(--accent)}
.drill-prog{display:grid;gap:.8rem;margin-bottom:1.2rem}
.rw-wrap{position:fixed;inset:0;z-index:60;background:color-mix(in srgb,var(--ink) 40%,transparent);display:grid;place-items:center;padding:16px}
.rw-card{background:var(--card);border:4px solid var(--star);border-radius:26px;padding:1.4rem 2rem 1.6rem;text-align:center;max-width:360px;width:100%;animation:pop .45s ease-out;box-shadow:0 20px 50px -20px rgba(0,0,0,.45)}
.rw-medal svg{width:6.5rem;height:6.5rem}
.rw-card h2{font-size:1.7rem;margin:.3rem 0}
.rw-card .btn{margin-top:.9rem}
.rw-stars{display:flex;justify-content:center;gap:.4rem;color:var(--star);font-size:2rem;line-height:1}
.rw-stars span{animation:rwbounce .8s ease-in-out infinite}
.rw-stars span:nth-child(2){animation-delay:.12s;font-size:2.6rem}
.rw-stars span:nth-child(3){animation-delay:.24s}
@keyframes rwbounce{50%{transform:translateY(-8px)}}
@media (max-width:640px){.drill-cards{grid-template-columns:1fr}.tt-tables{grid-template-columns:repeat(4,1fr)}.tt-eq{font-size:2.4rem}.as-stats{grid-template-columns:repeat(2,1fr)}.as-board{font-size:2.1rem}}
/* iPad landscape and other wide screens */
@media (min-width:900px){
  .split{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:1.2rem;align-items:start}
  .split>.sticky{position:sticky;top:calc(var(--head) + 1rem + env(safe-area-inset-top,0px))}
  .units{grid-template-columns:repeat(3,1fr)}
  .lv-top{grid-template-columns:1fr minmax(0,520px);align-items:end}
  .narrow{max-width:760px;margin-inline:auto}
  .qbody.has-vis{grid-template-columns:minmax(0,1fr) minmax(0,.9fr);align-items:start;column-gap:1.2rem}
  .qbody.has-vis .vis-box{grid-column:2;grid-row:1 / span 3;margin:0}
}
@media (max-width:640px){
  html{font-size:18px} html[data-big]{font-size:21px}
  h1{font-size:1.65rem}
  .hero{grid-template-columns:1fr}
  .ring{width:5.5rem;height:5.5rem}
  .howto{grid-template-columns:repeat(2,1fr)}
  .stage{font-size:.95rem;flex-direction:column;gap:0}
  .stage small{display:none}
  .ngrid{grid-template-columns:repeat(5,2.3rem)}
  .lvl{grid-template-columns:auto 1fr}
  .lvl .pips{grid-column:2}
  .clue-t{padding-left:.8rem}
}

<body>


<header class="top">
  <div class="top-in">
    <button class="brand" id="go-home" type="button" aria-label="回總目錄"><span class="brand-mark">5上</span>數學小步走</button>
    <span class="top-sp"></span>
    <button class="chip" id="t-rec" type="button">學習紀錄</button>
    <button class="chip" id="t-set" type="button" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg>設定</button>
  </div>
  <div class="settings" id="settings" hidden>
    <button class="chip" type="button" data-set="auto" aria-pressed="false">自動朗讀題目</button>
    <button class="chip" type="button" data-set="calm" aria-pressed="false">減敏模式（顏色淡、不動畫）</button>
    <button class="chip" type="button" data-set="big" aria-pressed="false">大字</button>
    <button class="chip" type="button" data-set="pad" aria-pressed="true">螢幕數字鍵盤</button>
    <button class="chip" type="button" data-set="calc" aria-pressed="false">計算機（練習時可用，評量不顯示）</button>
  </div>
</header>
<main id="view"></main>

<script>
/* ---------- helpers ---------- */
const $=(s,el=document)=>el.querySelector(s);
const $$=(s,el=document)=>[...el.querySelectorAll(s)];
const h=html=>{const t=document.createElement('template');t.innerHTML=html.trim();return t.content.firstElementChild;};
const gcd=(a,b)=>b?gcd(b,a%b):a, lcm=(a,b)=>a/gcd(a,b)*b;
const isPrime=n=>{if(n<2)return false;for(let i=2;i*i<=n;i++)if(n%i===0)return false;return true;};
const factors=n=>{const f=[];for(let i=1;i<=n;i++)if(n%i===0)f.push(i);return f;};
const r4=x=>Math.round(x*10000)/10000;
const fmt=x=>String(r4(x));
const F=(n,d)=>`<span class="fr" aria-label="${d}分之${n}"><span>${n}</span><span>${d}</span></span>`;
const MX=(w,n,d)=>`<span class="mixed" aria-label="${w}又${d}分之${n}">${w}${F(n,d)}</span>`;
const RAT=(a,b)=>`${a} : ${b}`;
const FR=(n,d)=>{const g0=gcd(n,d);return{type:'frac',n:n/g0,d:d/g0};};
const ICON={
  say:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>',

 {title:'面積的變化與應用',sub:'用符號寫公式、底或高變了會怎樣',
  look:{ex:'三角形的底不變，高變成 2 倍，面積會怎樣？',steps:[

  gen(g){const t=g.int(0,2);

    return{q:`${sh[0]}的${sh[3]}。`,v:'',steps:[{p:`面積公式用符號寫是？`,ans:fin},{p:`如果 a = ${a}，${sh[1].includes('b')?'b':'h'} = ${b}，面積 = ?`,ans:NUM(sh[2](a,b),'平方公分')}],ask:`a = ${a}、${sh[1].includes('b')?'b':'h'} = ${b} 時，面積是多少？`,ans:NUM(sh[2](a,b),'平方公分')};}

  fix:'用符號記公式；只有高（或底）變 k 倍，面積變 k 倍；底和高都變 k 倍，面積變 k × k 倍；複合圖形切開來算。'}
]},

/* ---------- speech ---------- */
function toSpeech(el){
  const c=el.cloneNode(true);
  c.querySelectorAll('svg,.no-say,table.ladder').forEach(x=>x.remove());
  c.querySelectorAll('.fr').forEach(f=>f.replaceWith(f.getAttribute('aria-label')||'多少'));
  c.querySelectorAll('.peek').forEach(p=>{const v=p.querySelector('.peek-v');p.replaceWith(v&&!v.hidden?v.textContent:'多少');});
  c.querySelectorAll('button').forEach(x=>x.remove());
  c.querySelectorAll('input').forEach(i=>i.replaceWith('多少'));
  return c.textContent.replace(/×/g,'乘').replace(/÷/g,'除以').replace(/＝|=/g,'等於').replace(/≈/g,'大約是').replace(/−/g,'減').replace(/\+|＋/g,'加').replace(/→/g,'變成')
    .replace(/\s:\s/g,'比').replace(/□|\?/g,'多少').replace(/°/g,'度').replace(/公里\/時/g,'公里每小時').replace(/公尺\/分/g,'公尺每分鐘').replace(/公尺\/秒/g,'公尺每秒').replace(/\s+/g,' ');
}
function speak(t){
  try{const s=window.speechSynthesis;if(!s)return;s.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='zh-TW';u.rate=.82;
    const vs=s.getVoices();const v=vs.find(v=>/zh[-_]TW/i.test(v.lang))||vs.find(v=>/^zh/i.test(v.lang));if(v)u.voice=v;s.speak(u);}catch(e){}
}
function sayBtn(target){const b=h(`<button class="say no-say" type="button" aria-label="唸給我聽">${ICON.say}</button>`);b.onclick=()=>speak(toSpeech(typeof target==='function'?target():target));return b;}/* 報讀：每個提示框、每個文字選項旁邊自動加喇叭（按了只唸，不會選答案） */function sayHook(root){root.querySelectorAll('.fb-msg:not([data-say])').forEach(m=>{m.dataset.say=1;const t=m.querySelector(':scope>div');if(!t||!t.textContent.trim())return;const b=sayBtn(t);b.classList.add('fb-say');m.append(b);});root.querySelectorAll('.choices .opt:not([data-say])').forEach(o=>{o.dataset.say=1;if(o.parentElement.classList.contains('opt-wrap'))return;const c=o.cloneNode(true);c.querySelectorAll('svg').forEach(x=>x.remove());if(!c.textContent.trim())return;const w=document.createElement('span');w.className='opt-wrap';o.replaceWith(w);w.append(o);const s=h(`<button class="opt-say no-say" type="button" aria-label="唸這個選項">${ICON.say}</button>`);s.onclick=e=>{e.preventDefault();e.stopPropagation();speak(toSpeech(o));};w.append(s);});}new MutationObserver(()=>sayHook(document.body)).observe(document.body,{childList:true,subtree:true});
function autoSay(el){if(store.set.auto&&el)setTimeout(()=>speak(toSpeech(el)),150);}

/* ---------- answers ---------- */
function parseNum(v){if(v==null)return NaN;v=String(v).trim().replace(/[０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-65248)).replace(/[．。]/g,'.').replace(/,/g,'');if(v==='')return NaN;return Number(v);}
const eq=(a,b)=>Math.abs(a-b)<1e-6;
function ansText(sp){
  if(sp.type==='num')return fmt(sp.a)+(sp.unit?' '+sp.unit:'');
  if(sp.type==='multi')return sp.parts.map(p=>`${p.pre||''} ${p.den?F(p.a,p.den):fmt(p.a)} ${p.post||''}`.trim()).join('　');
  if(sp.type==='frac')return sp.w?MX(sp.w,sp.n,sp.d):(sp.d===1?String(sp.n):F(sp.n,sp.d));
  if(sp.type==='choice')return sp.opts[sp.a];
  if(sp.type==='grid')return `底 ${sp.w} 格、高 ${sp.h} 格`;
  if(sp.type==='plot')return sp.labels.map((l,i)=>`${l} ${fmt(sp.values[i])}`).join('、');
  if(sp.type==='sector')return `圓心角 ${sp.a}°`;
  return '';
}
/* line-chart plotting: tap above each label to place its point */
function plotAnswer(sp,el){
  const vals=sp.labels.map(()=>null);el.classList.add('gridans');
  el.innerHTML=`<div class="vis-box"></div><p class="look-hint">在每個${sp.xname||'項目'}的上方點一下，放上點；點錯了再點一次就會移過去。</p>`;
  const box=$('.vis-box',el);
  function onTap(e){if(el.dataset.lock)return;const svg=e.currentTarget,r=svg.getBoundingClientRect(),G=chartGeom(sp),vb=svg.viewBox.baseVal;
    const vx=(e.clientX-r.left)/r.width*vb.width,vy=(e.clientY-r.top)/r.height*vb.height;const i=Math.floor((vx-G.L)/(G.pw/G.n));if(i<0||i>=G.n)return;
    let v=G.base+(1-(vy-G.T)/G.ph)*(sp.max-G.base);v=G.base+Math.round((v-G.base)/sp.step)*sp.step;v=Math.max(G.base,Math.min(sp.max,v));
    vals[i]=r4(v);el.classList.remove('bad');draw();}
  function draw(){box.innerHTML=lineChart(sp,vals,{guides:true,showVals:true});const svg=$('svg',box);svg.style.cursor='pointer';svg.style.touchAction='manipulation';svg.addEventListener('click',onTap);}
  draw();
  return{el,boxes:[],grid:true,check(){if(vals.some(v=>v==null))return null;const ok=vals.every((v,i)=>eq(v,sp.values[i]));el.classList.remove('ok','bad');el.classList.add(ok?'ok':'bad');return ok;},reveal(){},lock(){el.dataset.lock=1;}};
}

/* grid drawing: the student sizes a rectangle on grid paper with − / + buttons */
const GC=10,GR=7;
function gridSVG(w,h,ow,oh){const c=26;let g='';
  for(let i=0;i<=GC;i++)g+=`<line x1="${i*c}" y1="0" x2="${i*c}" y2="${GR*c}" class="gl"/>`;
  for(let j=0;j<=GR;j++)g+=`<line x1="0" y1="${j*c}" x2="${GC*c}" y2="${j*c}" class="gl"/>`;
  if(ow)g+=`<rect x="0" y="${(GR-oh)*c}" width="${ow*c}" height="${oh*c}" class="dash"/>`;
  g+=`<rect x="0" y="${(GR-h)*c}" width="${w*c}" height="${h*c}" class="fa st" style="fill-opacity:.85"/>`;
  return S(GC*c,GR*c,g,`底 ${w} 格、高 ${h} 格的長方形`);}
function gridAnswer(sp,el){
  let w=sp.w0,hh=sp.h0,touched=false;el.classList.add('gridans');
  el.innerHTML=`<div class="grid-draw"><div class="vis-box"></div><div class="grid-ctl">
    <div><span>底</span><button type="button" class="opt" data-d="w-">−</button><b data-v="w"></b><button type="button" class="opt" data-d="w+">＋</button><span>格</span></div>
    <div><span>高</span><button type="button" class="opt" data-d="h-">−</button><b data-v="h"></b><button type="button" class="opt" data-d="h+">＋</button><span>格</span></div>
    <p class="look-hint">虛線是原來的圖。按 ＋ − 改變大小。</p></div></div>`;
  const draw=()=>{$('.vis-box',el).innerHTML=gridSVG(w,hh,sp.w0,sp.h0);$('[data-v="w"]',el).textContent=w;$('[data-v="h"]',el).textContent=hh;};
  $$('[data-d]',el).forEach(b=>b.onclick=()=>{if(el.dataset.lock)return;const d=b.dataset.d;touched=true;el.classList.remove('bad');
    if(d==='w+')w=Math.min(GC,w+1);if(d==='w-')w=Math.max(1,w-1);if(d==='h+')hh=Math.min(GR,hh+1);if(d==='h-')hh=Math.max(1,hh-1);draw();});
  draw();
  return{el,boxes:[],grid:true,check(){if(!touched)return null;const ok=w===sp.w&&hh===sp.h;el.classList.remove('ok','bad');el.classList.add(ok?'ok':'bad');return ok;},reveal(){},lock(){el.dataset.lock=1;}};
}
const boxHTML=lab=>`<input class="box" type="text" inputmode="${store.set.pad?'none':'decimal'}" autocomplete="off" autocorrect="off" spellcheck="false" aria-label="${lab||'答案'}">`;
function answer(sp,{onPick}={}){
  const el=document.createElement('div');el.className='ans';
  if(sp.type==='choice'){
    el.classList.add('choices');let sel=null;
    sp.opts.forEach((o,i)=>{const b=h(`<button class="opt" type="button">${o}</button>`);b.onclick=()=>{if(el.dataset.lock)return;sel=i;$$('.opt',el).forEach(x=>{x.classList.toggle('sel',x===b);x.classList.remove('bad');});onPick&&onPick();};el.append(b);});
    return{el,choice:true,boxes:[],check(){if(sel===null)return null;const ok=sel===sp.a;$$('.opt',el)[sel].classList.add(ok?'ok':'bad');return ok;},
      reveal(){$$('.opt',el)[sp.a].classList.add('ok');},lock(){el.dataset.lock=1;}};
  }
  if(sp.type==='grid')return gridAnswer(sp,el);
  if(sp.type==='plot')return plotAnswer(sp,el);
  if(sp.type==='sector')return sectorAnswer(sp,el);
  if(sp.type==='num')el.innerHTML=`<span class="part">${boxHTML()}${sp.unit?`<span>${sp.unit}</span>`:''}</span>`;
  else if(sp.type==='multi')el.innerHTML=sp.parts.map(p=>`<span class="part">${p.pre?`<span>${p.pre}</span>`:''}${p.den?`<span class="fr">${boxHTML('分子')}<span>${p.den}</span></span>`:boxHTML()}${p.post?`<span>${p.post}</span>`:''}</span>`).join('');
  else if(sp.type==='frac')el.innerHTML=`<span class="part">${sp.w!=null?boxHTML('整數'):''}<span class="fr">${boxHTML('分子')}${boxHTML('分母')}</span></span>`;
  const boxes=$$('.box',el);
  function check(){
    const vals=boxes.map(b=>b.value.trim());
    if(vals.every(v=>v===''))return null;
    let ok=false;boxes.forEach(b=>b.classList.remove('ok','bad'));
    if(sp.type==='num'){ok=eq(parseNum(vals[0]),sp.a);boxes[0].classList.add(ok?'ok':'bad');}
    else if(sp.type==='multi'){ok=true;sp.parts.forEach((p,i)=>{const o=eq(parseNum(vals[i]),p.a);if(!o)ok=false;boxes[i].classList.add(o?'ok':'bad');});}
    else{let i=0;const w=sp.w!=null?(parseNum(vals[i++])||0):0;const n=parseNum(vals[i]),d=vals[i+1]===''?1:parseNum(vals[i+1]);
      ok=!isNaN(n)&&!isNaN(d)&&d!==0&&eq(w+n/d,(sp.w||0)+sp.n/sp.d);
      if(ok&&sp.simplest)ok=gcd(Math.round(n),Math.round(d))===1&&vals[i+1]!=='';
      boxes.forEach(b=>b.classList.add(ok?'ok':'bad'));}
    return ok;
  }
  return{el,boxes,check,reveal(){},lock(){boxes.forEach(b=>b.readOnly=true);}};
}

/* one practice question: prompt + answer + check + feedback */
function qa({prompt,spec,hint,onDone,onWrong,why,num,fallback,noReveal}){
  const wrap=h('<div class="step"></div>');
  if(num)wrap.append(h(`<div class="step-n">第 ${num} 步</div>`));
  const pr=h(`<div class="prompt"><div class="txt">${prompt}</div></div>`);pr.prepend(sayBtn(pr.querySelector('.txt')));wrap.append(pr);
  const A=answer(spec,{onPick:()=>doCheck()});wrap.append(A.el);
  const fb=h('<div class="fb-wrap" aria-live="polite"></div>');
  let tries=0,done=false;
  const btn=h(`<button class="btn small" type="button" data-role="check">${ICON.check}檢查</button>`);
  if(!A.choice){btn.innerHTML=A.grid?`${ICON.check}畫好了，檢查`:btn.innerHTML;const r=h('<div class="row" style="margin-top:.7rem"></div>');r.append(btn);wrap.append(r);btn.onclick=()=>doCheck();
    A.boxes.forEach((b,i)=>b.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();if(i<A.boxes.length-1&&A.boxes[i+1].value==='')A.boxes[i+1].focus();else doCheck();}}));}
  wrap.append(fb);
  function msg(cls,html){fb.innerHTML='';fb.append(h(`<div class="fb-msg ${cls}">${cls==='ok'?ICON.check:ICON.bulb}<div>${html}</div></div>`));}
  function doCheck(){
    if(done)return;const r=A.check();
    if(r===null){msg('info',A.grid?'先按 ＋ − 把長方形畫出來，再按「檢查」。':'先寫下答案，再按「檢查」。');return;}
    if(r){done=true;A.lock();btn.remove();wrap.classList.add('done');hidePad();msg('ok',pickMsg(OK_MSG)+(why?`<br><span style="font-weight:400;color:var(--ink)">${why}</span>`:''));onDone&&onDone(tries===0);return;}
    tries++;
    let special='';
    if(spec.miss&&A.boxes[0]){const v=parseNum(A.boxes[0].value);const mm=spec.miss.find(x=>eq(x.a,v));if(mm)special=mm.m;}
    if(spec.missF&&A.boxes.length){const vs=A.boxes.map(b=>b.value.trim());let i=0;const w=spec.w!=null?(parseNum(vs[i++])||0):0;const n=parseNum(vs[i]),d=vs[i+1]===''?1:parseNum(vs[i+1]);const mm=spec.missF.find(x=>eq(x.v,w+n/d));if(mm)special=mm.m;}
    /* noReveal: never show the answer here; send the student to the step-by-step guide instead */
    if(noReveal){msg('bad',`${special?special+'<br>':''}${noReveal()}`);onWrong&&onWrong(tries);return;}
    const tip=hint||(fallback?`想想「我看」的重點：${fallback}`:'');
    if(tries===1)msg('bad',`${special||'差一點點，再試一次。'}${tip?'<br>提示：'+tip:''}`);
    else msg('bad',`${special?special+'<br>':''}答案是 <b>${ansText(spec)}</b>。${why?why+'<br>':''}${A.choice?'請點正確的答案。':A.grid?'請照答案再畫一次。':'請你自己把它填進去。'}`);
    onWrong&&onWrong(tries);
  }
  wrap.focusFirst=()=>{if(A.boxes[0])A.boxes[0].focus({preventScroll:true});};
  return wrap;
}

  $$('[data-s]',box).forEach(b=>b.onclick=()=>{const n=+b.dataset.s;TT.sel=TT.sel.includes(n)?TT.sel.filter(x=>x!==n):[...TT.sel,n].sort((x,y)=>x-y);if(!TT.sel.length)TT.sel=[n];ttQuizSetup();});
  $('#tt-go',box).onclick=()=>{const list=[];let prev='';for(let i=0;i<20;i++){let a,b,k;do{a=TT.sel[ri(0,TT.sel.length-1)];b=ri(1,9);k=a+'x'+b;}while(k===prev&&TT.sel.length*9>1);prev=k;list.push({a,b,hide:Math.random()<.2?'b':'c'});}ttRun(list,true);};
}
function ttRun(list,quiz){
  list=list||ttList();const box=$('#tt-stage');let i=0,typed='',tries=0,first=0,lock=false,streak=0;const wrong=[];const t0=Date.now();
  const sayQ=q=>q.hide==='b'?`${q.a} 乘 多少 等於 ${q.a*q.b}`:`${q.a} 乘 ${q.b} 等於多少`;
  function draw(){if(!box.isConnected)return;const q=list[i];const c=q.a*q.b;
    const cell=(v,h)=>h?`<span class="tt-blank">？</span>`:`<span>${v}</span>`;
    box.innerHTML=`<div class="split"><div class="card tt-card">
      <div class="tt-dots">${list.map((_,j)=>`<i class="${j<i?'done':j===i?'cur':''}"></i>`).join('')}</div>
      <div class="tt-eq">${cell(q.a,false)}<span class="op">×</span>${cell(q.b,q.hide==='b')}<span class="op">=</span>${cell(c,q.hide==='c')}</div>
      <div id="tt-fb" aria-live="polite"></div>
      <div class="row" style="justify-content:center;margin-top:.6rem"><button class="say no-say" type="button" id="tt-say" aria-label="唸題目">${ICON.say}</button><span class="muted">第 ${i+1} / ${list.length} 題${quiz?'':'・一次就答對 '+first+' 題'}</span></div>
    </div><div>${padHTML(['7','8','9','4','5','6','1','2','3','⌫','0','確定'])}</div></div>`;
    $('#tt-say',box).onclick=()=>speak(sayQ(q));
    $$('.dkey',box).forEach(b=>b.onclick=()=>key(b.dataset.k));
    if(store.set.auto)speak(sayQ(q));
  }
  function msg(cls,html){const f=$('#tt-fb',box);if(f)f.innerHTML=`<div class="fb-msg ${cls}">${cls==='ok'?ICON.check:ICON.bulb}<div>${html}</div></div>`;}
  function refresh(){const b=$('.tt-blank',box);if(!b)return;b.textContent=typed||'？';b.classList.toggle('typed',!!typed);b.classList.remove('bad');}
  function key(k){if(lock)return;const q=list[i];const ans=q.hide==='b'?q.b:q.a*q.b;
    if(k==='⌫'){typed=typed.slice(0,-1);refresh();return;}
    if(k==='確定'||k==='OK'){if(typed)check();return;}
    if(typed.length>=2)return;typed+=k;refresh();if(typed.length>=String(ans).length)setTimeout(check,180);}
  function next(){i++;typed='';tries=0;lock=false;i<list.length?draw():finish();}
  function check(){if(lock)return;const q=list[i];const c=q.a*q.b;const ans=q.hide==='b'?q.b:c;const bl=$('.tt-blank',box);
    if(Number(typed)===ans){lock=true;if(tries===0)first++;bl.classList.add('ok');msg('ok',pickMsg(OK_MSG));if(quiz){streak++;if(streak%3===0){setTimeout(()=>{if(box.isConnected)asReward(streak,()=>{if(box.isConnected)next();});},450);return;}}setTimeout(next,quiz?450:650);return;}
    tries++;bl.classList.add('bad');
    if(quiz){lock=true;streak=0;wrong.push(q);msg('bad',`答案是 <b>${q.a} × ${q.b} = ${c}</b>`);setTimeout(next,1500);return;}
    if(tries===1)msg('bad','再想一想。'+(q.hide==='b'?`${q.a} 一個一個加上去，加幾次會變成 ${c}？`:q.b>1?`提示：${q.a} × ${q.b-1} = ${q.a*(q.b-1)}，再加 ${q.a}。`:`提示：${q.a} × 1 就是 ${q.a}。`));
    else msg('bad',`答案是 <b>${q.a} × ${q.b} = ${c}</b>，請你自己把它填進去。`);
    typed='';setTimeout(refresh,500);}
  function finish(){if(!box.isConnected)return;const D=drillStore();const n=list.length;drillStop();
    if(quiz){const r=n-wrong.length,last={r,n,t:Date.now(),sel:TT.sel.slice()};if(!D.quiz)D.quiz={best:last,last};D.quiz.last=last;if(r/n>D.quiz.best.r/D.quiz.best.n)D.quiz.best=last;save();
      const tables=[...new Set(wrong.map(q=>q.a))].sort((x,y)=>x-y);
      box.innerHTML=`<div class="card stamp narrow"><h2>小測驗結果</h2><div class="score" style="justify-content:center">${r} / ${n}<span class="score-pct">${Math.round(r/n*100)} 分</span></div><p class="muted">用了 ${Math.round((Date.now()-t0)/1000)} 秒</p>
       ${wrong.length?`<p><b>答錯的題目</b></p><div class="chips" style="justify-content:center">${wrong.map(q=>`<span>${q.a} × ${q.b} = ${q.a*q.b}</span>`).join('')}</div><p class="muted">建議再練習：${tables.map(t=>t+' 的乘法').join('、')}</p>`:'<p class="ok-line">全部答對，太厲害了！</p>'}
       <div class="row" style="justify-content:center;margin-top:1rem"><button class="btn ghost" type="button" id="tt-again">${ICON.retry}再考一次</button></div></div>`;
      $('#tt-again').onclick=()=>ttQuizSetup();return;}
    const pass=first>=n-1;const m=D.tt[TT.n]=D.tt[TT.n]||{};const newly=pass&&!m[TT.mode];if(pass)m[TT.mode]=true;save();
    const nm=TT_MODES.find(x=>x[0]===TT.mode)[1];const mastered=ttMastered(TT.n);const nextM=TT_STEPS.find(k=>!m[k]);
    box.innerHTML=`<div class="card stamp narrow">${pass?`<div class="big">${ICON.check}</div><h2>${TT.n} 的乘法・${nm} 過關！</h2>`:`<h2>${TT.n} 的乘法・${nm}</h2>`}
     <p class="lead">一次就答對 ${first} / ${n} 題。${pass?'':'一次答對 '+(n-1)+' 題以上就過關，再試一次！'}</p>
     ${mastered&&newly?`<p class="new-rec">${TT.n} 的乘法三關都過了，精熟了！</p>`:''}
     <div class="row" style="justify-content:center;margin-top:1rem"><button class="btn ghost" type="button" id="tt-again">${ICON.retry}再練一次</button>${nextM?`<button class="btn" type="button" id="tt-next">下一關：${TT_MODES.find(x=>x[0]===nextM)[1]}${ICON.next}</button>`:mastered&&TT.n<9?`<button class="btn" type="button" id="tt-next">換 ${TT.n+1} 的乘法${ICON.next}</button>`:mastered?`<button class="btn" type="button" id="tt-next">去做小測驗${ICON.next}</button>`:''}</div></div>`;
    $('#tt-again').onclick=()=>viewTimes();const nx=$('#tt-next');if(nx)nx.onclick=()=>{if(nextM)TT.mode=nextM;else if(TT.n<9){TT.n++;TT.mode='seq';}else TT.mode='quiz';viewTimes();};}
  drillKeys(key);draw();
}

/* 加減法特訓（依老師原本的「進退位加減特訓站」改編，加上三位數關卡） */
const AS_NAMES=['','不進退位','加入進位','加入退位','綜合挑戰','三位數挑戰'];
const AS_W=[null,{addNo:.45,subNo:.45,addCarry:.05,subBorrow:.05},{addNo:.3,subNo:.3,addCarry:.25,subBorrow:.15},{addNo:.2,subNo:.2,addCarry:.3,subBorrow:.3},{addNo:.1,subNo:.1,addCarry:.4,subBorrow:.4},{add3:.5,sub3:.5}];
const AS_TH=[0,6,14,24,36];

const tens=x=>Math.floor(x/10)%10;
const AS_GEN={
  addNo(){let a,b,t=0;do{a=ri(10,89);b=ri(10,89);t++;}while(t<400&&!((a%10)+(b%10)<=9&&tens(a)+tens(b)<=9));return{a,b,op:'+',ans:a+b,type:'addNo'};},
  addCarry(){let a,b,t=0;do{a=ri(10,89);b=ri(10,89);t++;}while(t<400&&!((a%10)+(b%10)>=10&&tens(a)+tens(b)+1<=9));return{a,b,op:'+',ans:a+b,type:'addCarry'};},
  subNo(){let a,b,t=0;do{a=ri(10,99);b=ri(10,98);t++;}while(t<400&&!(a>b&&(a%10)>=(b%10)&&tens(a)>=tens(b)));return{a,b,op:'−',ans:a-b,type:'subNo'};},
  subBorrow(){let a,b,t=0;do{a=ri(10,99);b=ri(10,98);t++;}while(t<400&&!(a>b&&(a%10)<(b%10)&&tens(a)>tens(b)));return{a,b,op:'−',ans:a-b,type:'subBorrow'};},
  add3(){let a,b,t=0;do{a=ri(100,899);b=ri(100,899);t++;}while(t<400&&!(a+b<=999&&((a%10)+(b%10)>=10||tens(a)+tens(b)>=10)));return{a,b,op:'+',ans:a+b,type:'add3'};},
  sub3(){let a,b,t=0;do{a=ri(220,999);b=ri(100,a-100);t++;}while(t<400&&!((a%10)<(b%10)||tens(a)<tens(b)));return{a,b,op:'−',ans:a-b,type:'sub3'};}
};
let AS=null;
function asInit(){const D=drillStore();if(!AS)AS={level:D.as.manual||1,manual:!!D.as.manual,timed:D.as.timed!==false,streak:0,total:0,correct:0,timeSum:0,queue:[],cur:null};}
function asLevelFor(c){let l=1;for(let i=1;i<AS_TH.length;i++)if(c>=AS_TH[i])l=i+1;return Math.min(l,5);}
function asType(){const w=AS_W[AS.level];let r=Math.random(),acc=0;for(const k in w){acc+=w[k];if(r<=acc)return k;}return Object.keys(w)[0];}

function viewAddSub(){

function asStats(){const D=drillStore();const s=$('#as-s');if(!s)return;s.textContent=AS.streak;$('#as-l').textContent='Lv.'+AS.level;$('#as-a').textContent=AS.total?Math.round(AS.correct/AS.total*100)+'%':'–';$('#as-t').textContent=AS.total?(AS.timeSum/AS.total).toFixed(1)+'s':'–';$('#as-best').textContent=D.as.best||0;}

function asBoard(){const p=AS.cur;const cols=Math.max(String(p.a).length,String(p.b).length,p.len);const pad=(n)=>{const d=String(n).split('');return Array(cols-d.length).fill('').concat(d);};
  let h=`<div class="as-board" style="grid-template-columns:2.4rem repeat(${cols},3.2rem)"><div></div>${Array.from({length:cols},(_,c)=>`<div class="c"><button type="button" class="as-note" data-c="${c}" aria-label="記進位或借位"></button></div>`).join('')}`;
  h+=`<div></div>${pad(p.a).map(d=>`<div class="c">${d}</div>`).join('')}<div class="c op">${p.op}</div>${pad(p.b).map(d=>`<div class="c">${d}</div>`).join('')}<div class="rule"></div><div></div>`;

  $$('.as-note').forEach(b=>b.onclick=()=>{b.textContent=b.textContent?'':'1';});
  $$('.as-ans').forEach(b=>b.onclick=()=>{if(p.lock)return;p.pos=+b.dataset.p;asBoard();});
  if(store.set.auto&&!p.said){p.said=true;speak(`${p.a} ${p.op==='+'?'加':'減'} ${p.b} 等於多少`);}

function asKey(k){const p=AS.cur;if(!p||p.lock)return;
  if(k==='⏭'){asSkip();return;}
  if(k==='⌫'){if(p.dig[p.pos]!=null)p.dig[p.pos]=null;else if(p.pos>0){p.pos--;p.dig[p.pos]=null;}asBoard();return;}
  p.dig[p.pos]=k;const empty=p.dig.findIndex(d=>d==null);if(empty<0){asBoard();asSubmit();return;}p.pos=p.pos<p.len-1&&p.dig[p.pos+1]==null?p.pos+1:empty;asBoard();}
function asTimer(){clearInterval(DR.timer);const fill=$('#as-fill'),num=$('#as-num');const p=AS.cur;p.t0=Date.now();fill.classList.remove('warn','danger');
  if(!AS.timed){fill.style.width='100%';num.textContent='0s';DR.timer=setInterval(()=>{if(!$('#as-num'))return drillStop();num.textContent=Math.floor((Date.now()-p.t0)/1000)+'s';},250);return;}
  num.textContent='30s';fill.style.width='100%';
  DR.timer=setInterval(()=>{if(!$('#as-fill'))return drillStop();const rem=30-(Date.now()-p.t0)/1000;if(rem<=0){clearInterval(DR.timer);fill.style.width='0%';asResult(false,30,true);return;}const pc=rem/30;fill.style.width=pc*100+'%';num.textContent=Math.ceil(rem)+'s';fill.classList.toggle('warn',pc<=.5&&pc>.2);fill.classList.toggle('danger',pc<=.2);},100);}
function asSubmit(){const p=AS.cur;if(!p||p.lock||p.dig.some(d=>d==null))return;clearInterval(DR.timer);const typed=Number(p.dig.slice().reverse().join(''));asResult(typed===p.ans,(Date.now()-p.t0)/1000,false);}

function asMsg(cls,html){const f=$('#as-fb');if(f)f.innerHTML=`<div class="fb-msg ${cls}">${cls==='ok'?ICON.check:ICON.bulb}<div>${html}</div></div>`;}
function asResult(ok,sec,timeout){const p=AS.cur,D=drillStore();if(p.lock)return;p.lock=true;AS.total++;AS.timeSum+=AS.timed?Math.min(sec,30):sec;
  if(ok){AS.correct++;AS.streak++;if(AS.streak>(D.as.best||0))D.as.best=AS.streak;p.res='ok';asBoard();asMsg('ok',AS_GOOD[ri(0,AS_GOOD.length-1)]);}
  else{AS.streak=0;p.dig=String(p.ans).split('').reverse();p.res='bad';asBoard();asMsg('bad',`正確答案：${p.a} ${p.op} ${p.b} = ${p.ans}・${(timeout?AS_TIME:AS_BAD)[ri(0,1)]}`);AS.queue.splice(Math.min(AS.queue.length,ri(2,4)),0,AS_GEN[p.type]());}
  if(!AS.manual){const nl=asLevelFor(AS.correct);if(nl>AS.level){AS.level=nl;AS.queue=[];asMsg('ok',`升級囉！進入第 ${nl} 關・${AS_NAMES[nl]}`);}}
  D.as.lv=Math.max(D.as.lv||1,AS.level);save();asStats();const go=()=>{if($('#as-board'))asNext();};if(ok&&AS.streak>0&&AS.streak%3===0)setTimeout(()=>asReward(AS.streak,go),500);else setTimeout(go,ok?900:1800);}

function asChime(){if(store.set.calm)return;try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;const ac=asChime.ac||(asChime.ac=new C());[523,659,784,1047].forEach((f,i)=>{const o=ac.createOscillator(),g=ac.createGain();o.type='triangle';o.frequency.value=f;const t0=ac.currentTime+i*.11;g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(.18,t0+.02);g.gain.exponentialRampToValueAtTime(.001,t0+.35);o.connect(g).connect(ac.destination);o.start(t0);o.stop(t0+.4);});}catch(e){}}

const GROUPS=[[0,4],[5,9]];

/* small calculator: + − × ÷ with normal order of operations */
function calcEval(s){
  const t=s.match(/\d+(?:\.\d+)?|[+\-×÷]/g);if(!t)return '';
  const nums=[],ops=[];let i=0;
  const num=x=>{const v=Number(x);if(isNaN(v))throw 0;return v;};
  nums.push(num(t[i++]));
  while(i<t.length){const op=t[i++];if(i>=t.length)break;const b=num(t[i++]);
    if(op==='×')nums.push(nums.pop()*b);else if(op==='÷'){if(b===0)throw 0;nums.push(nums.pop()/b);}else{ops.push(op);nums.push(b);}}
  let r=nums[0];ops.forEach((op,j)=>{r=op==='+'?r+nums[j+1]:r-nums[j+1];});
  return fmt(r);
}
function calcWidget(){
  const w=h(`<div class="calc" hidden><div class="scr" aria-live="polite"></div>${['7','8','9','÷','4','5','6','×','1','2','3','−','0','.','=','+','C','⌫'].map(k=>`<button type="button" class="${'÷×−+'.includes(k)?'op':k==='='?'eq':''}" data-c="${k}">${k}</button>`).join('')}</div>`);
  const scr=$('.scr',w);let s='';
  w.addEventListener('pointerdown',e=>e.preventDefault());
  w.addEventListener('click',e=>{const k=e.target.closest('button')?.dataset.c;if(!k)return;
    if(k==='C')s='';else if(k==='⌫')s=s.slice(0,-1);
    else if(k==='='){try{s=calcEval(s.replace(/−/g,'-').replace(/-/g,'-'));}catch(_){s='';scr.textContent='算式不完整';return;}}
    else s+=k==='−'?'-':k;
    scr.textContent=s.replace(/-/g,'−');});
  return w;
}

  function show(){
    box.innerHTML='';
    const top=h(`<div class="stars" aria-label="一次就答對 ${stars.filter(Boolean).length} 題">${Array.from({length:N},(_,j)=>ICON.star.replace('<svg',`<svg class="${stars[j]?'on':''}"`)).join('')}</div>`);
    box.append(top);
    if(n>=N){
      markStage(u,l,adv?'achal':'can');
      const SR=awardStars(u,l,stars,typeof adv!=='undefined'&&!!adv);
      const hasNext=l+1<U[u].levels.length;
      const st=h(`<div class="card stamp narrow"><div class="big">${ICON.check}</div><h2>第 ${l+1} 關${adv?'挑戰成功':'過關了'}！</h2>${starResult(SR)}<div class="row" style="justify-content:center;margin-top:1rem"></div></div>`);
      const row=$('.row',st);
      const again=h(`<button class="btn ghost" type="button">${ICON.retry}再練 3 題</button>`);again.onclick=()=>stCan(box,u,l,L,goStage,adv);
      const nx=h(`<button class="btn" type="button">${hasNext?`下一關：${U[u].levels[l+1].title}`:'去做形成性評量'}${ICON.next}</button>`);
      nx.onclick=()=>go(hasNext?`u${u+1}-l${l+2}`:`u${u+1}-quiz`);
      row.append(again,nx);box.append(st);return;
    }
    let p,tt=0;do{p=(adv?L.adv:L.gen).call(L,mkR(null));tt++;}while(tt<40&&(seenC.has(pKey(p))||seenC.has(pKey2(p))));seenC.add(pKey(p));seenC.add(pKey2(p));
    const sp=h('<div class="split"><div class="sticky"></div><div class="right"></div></div>');
    const card=problemCard(p);card.prepend(h(`<div class="step-n">第 ${n+1} 題 / 共 ${N} 題</div>`));$('.sticky',sp).append(card);
    const right=$('.right',sp);const vis=$('.vis-box',card);
    const guide=h(`<button class="btn ghost small" type="button" style="margin-top:.7rem">${ICON.bulb}卡住了？帶我一步一步做</button>`);
    const gsteps=h('<div class="steps" style="margin-top:.8rem" hidden></div>');
    let guideUsed=false,guideDone=false;
    /* 進階挑戰: a wrong answer never shows the answer; the student works it out with the step-by-step guide */
    const advMsg=()=>!guideUsed?`還不對喔，先不要猜。按下面的「卡住了？帶我一步一步做」，一步一步算出來。`
      :!guideDone?'先把下面的步驟一步一步做完，就能算出答案。':'對照下面每一步算出來的結果，再檢查一次你的答案。';
    const el=qa({prompt:askPrompt(p),spec:p.ans,fallback:L.look.key,noReveal:adv?advMsg:null,
      onWrong(){if(!guideUsed){guide.classList.add('pulse');guide.scrollIntoView({block:'nearest',behavior:store.set.calm?'auto':'smooth'});}},
      onDone(first){stars.push(first);guide.remove();
      const b=h(`<button class="btn" type="button" style="margin-top:1rem">${n+1<N?'下一題':'看結果'}${ICON.next}</button>`);b.onclick=()=>{n++;show();};right.append(b);b.focus({preventScroll:true});}});
    /* fading scaffold: the same problem broken back into the 我做 steps, then the student answers it */
    guide.onclick=()=>{guideUsed=true;guide.remove();gsteps.hidden=false;let j=0;
      const nextG=()=>{if(j>=p.steps.length){guideDone=true;gsteps.append(h(`<div class="fb-msg info">${ICON.bulb}<div>步驟都做完了！回到上面，把最後的答案填進去。</div></div>`));el.focusFirst();return;}
        const s=p.steps[j];const st=qa({prompt:s.p,spec:s.ans,hint:s.hint,fallback:L.look.key,num:j+1,onDone(){if(s.vis){vis.hidden=false;vis.innerHTML=s.vis;}j++;setTimeout(nextG,300);}});
        gsteps.append(st);st.focusFirst();};
      nextG();};
    right.append(el,guide,gsteps);box.append(sp);el.focusFirst();autoSay($('.txt',card));
  }
  show();
}

/* ---------- quiz ---------- */
const DIFF={b:{name:'基礎卷',desc:'數字小、步驟少'},a:{name:'進階卷',desc:'數字大、多一步、反過來想'}};
/* ---------- no repeated questions ---------- */
const plainTxt=s=>{const d=document.createElement('div');d.innerHTML=s||'';return d.textContent.replace(/\s+/g,'');};
const pKey=p=>plainTxt(p.q)+'|'+(p.v||'')+'|'+plainTxt(p.ask)+'|'+(p.ans&&p.ans.type==='choice'?plainTxt(p.ans.opts[p.ans.a]):JSON.stringify(p.ans));
/* if the problem text already asks the question, keep only an extra hint in （） from ask */
function askPart(q,ask){
  if(!ask)return '';const Q=plainTxt(q),A=plainTxt(ask);if(!A||Q===A||Q.includes(A))return '';
  if(/[？?]）?$/.test(Q)||/[？?]（[^）]*）$/.test(Q)){const m=ask.match(/（[^）]*）\s*$/);return m&&!Q.includes(plainTxt(m[0]))?m[0]:'';}
  return ask;
}
const pKey2=p=>plainTxt(qWithAsk(p.q,p.ask))+'='+plainTxt(ansText(p.ans));
const qWithAsk=(q,ask)=>{const x=askPart(q,ask);return !x?q:x.startsWith('（')?q+x:q+'<br>'+x;};
const askPrompt=p=>{const x=askPart(p.q,p.ask);return !x?'寫下你的答案：':x.startsWith('（')?'寫下你的答案'+x+'：':x;};
function quizItems(u,ver,diff){  const L=U[u].levels;const items=[];const seen=new Set();const uniqGen=f=>{let p,t=0;do{p=f();t++;}while(t<40&&(seen.has(pKey(p))||seen.has(pKey2(p))));seen.add(pKey(p));seen.add(pKey2(p));return p;};
  if(diff==='a'){const g=mkR(1000*(u+1)+77*ver+5003);const per=Math.max(2,Math.ceil(10/L.length));
    L.forEach((lv,li)=>{for(let j=0;j<per;j++){const p=uniqGen(()=>lv.adv(g));items.push({li,q:p.q,v:p.v,ask:p.ask,ans:p.ans});}});return items;}
  const g=mkR(1000*(u+1)+77*ver+1);const per=Math.max(1,Math.ceil(10/L.length)-1);
  L.forEach((lv,li)=>{
    const k=lv.know[ver%lv.know.length];items.push({li,q:k.q,v:'',ask:'',ans:ch(k.opts,k.a,g)});seen.add(pKey2(items[items.length-1]));
    for(let j=0;j<per;j++){const p=uniqGen(()=>lv.gen(g));items.push({li,q:p.q,v:p.v,ask:p.ask,ans:p.ans});}
  });
  return items;
}
function viewQuiz(u){
  const un=U[u];const ver=store.qv[u]||0;const diff=store.qd[u]||'b';const items=quizItems(u,ver,diff);const VN=['A','B','C'];
  V().innerHTML=`<div style="${uvar(u)}">
   <div class="crumbs"><button class="link" type="button" data-go="u${u+1}">${ICON.back}第 ${u+1} 單元　${un.name}</button></div>
   <div class="qhead"><div><h1>形成性評量・${DIFF[diff].name}</h1><p class="lead">第 ${u+1} 單元《${un.name}》・共 ${items.length} 題。全部寫完再按最下面的「交卷」。</p></div>
     <div class="qopts">
       <div class="seg" role="group" aria-label="難度">${Object.entries(DIFF).map(([k,d])=>`<button type="button" data-diff="${k}" aria-pressed="${k===diff}">${d.name}<small>${d.desc}</small></button>`).join('')}</div>
       <div class="ver">試卷版本：${VN.map((n,i)=>`<button class="chip" type="button" data-ver="${i}" aria-pressed="${i===ver}">${n} 卷</button>`).join('')}</div></div></div>
   <div id="qres" aria-live="polite"></div>
   <div class="qlist" id="qlist"></div>
   <div class="row" style="margin-top:1.2rem"><button class="btn" type="button" id="qsubmit">${ICON.check}交卷</button><button class="btn ghost" type="button" id="qreset">${ICON.retry}重新作答</button></div></div>`;
  bindGo(V());
  $$('[data-ver]').forEach(b=>b.onclick=()=>{store.qv[u]=+b.dataset.ver;save();viewQuiz(u);});
  $$('[data-diff]').forEach(b=>b.onclick=()=>{store.qd[u]=b.dataset.diff;save();viewQuiz(u);});
  const list=$('#qlist');const W=[];
  items.forEach((it,i)=>{
    const el=h(`<div class="qitem"><div class="qno">${i+1}</div><div class="qbody ${it.v?'has-vis':''}"><div class="prompt"><div class="txt">${qWithAsk(it.q,it.ask)}</div></div>${it.v?`<div class="vis-box">${it.v}</div>`:''}</div></div>`);
    $('.prompt',el).prepend(sayBtn($('.txt',el)));
    const A=answer(it.ans);$('.qbody',el).append(A.el);
    A.boxes.forEach(b=>b.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();const all=$$('.box',list);const j=all.indexOf(b);if(all[j+1])all[j+1].focus();}}));
    list.append(el);W.push({A,el,it});
  });
  $('#qreset').onclick=()=>viewQuiz(u);
  $('#qsubmit').onclick=()=>{
    hidePad();let right=0;const per=un.levels.map(()=>({t:0,r:0}));
    W.forEach(({A,el,it})=>{const ok=A.check()===true;A.lock();if(!ok&&A.choice)A.reveal();
      el.classList.add(ok?'right':'wrong');per[it.li].t++;if(ok){right++;per[it.li].r++;}
      if(!ok)$('.qbody',el).append(h(`<div class="fb-msg bad">${ICON.bulb}<div>正確答案：${ansText(it.ans)}</div></div>`));});
    const sc=`${right}/${W.length}`;const kk=u+diff;const prev=store.q[kk];
    if(!prev||right>parseInt(prev))store.q[kk]=sc;store.qh=store.qh||{};(store.qh[u]=store.qh[u]||[]).unshift({t:Date.now(),d:diff,v:ver,r:right,n:W.length,per:per.map(x=>[x.r,x.t])});store.qh[u]=store.qh[u].slice(0,10);save();
    $('#qres').innerHTML=`<div class="card" style="margin-bottom:1rem"><div class="score">${right} / ${W.length}<span class="score-pct">${Math.round(right/W.length*100)} 分</span></div><div class="lead">${right===W.length?'全部答對！':'答錯的題目，可以回到下面建議的關卡再練習。'}</div>
      <table class="key"><thead><tr><th>關卡</th><th>答對</th><th>建議</th></tr></thead><tbody>${un.levels.map((lv,li)=>`<tr><td>第 ${li+1} 關　${lv.title}</td><td>${per[li].r} / ${per[li].t}</td><td>${per[li].r===per[li].t?'很好':`<button class="link" type="button" data-go="u${u+1}-l${li+1}">回去練習 ${ICON.next}</button>`}</td></tr>`).join('')}</tbody></table></div>`;
    bindGo($('#qres'));
    $('#qsubmit').disabled=true;window.scrollTo({top:0,behavior:store.set.calm?'auto':'smooth'});
  };
}

applySet();render();
</script>

if('serviceWorker' in navigator){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));}
